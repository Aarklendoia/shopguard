name: Worker

# Format, lint, tests, dependency policy and a static musl build on every PR and push.

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  pull_request:

defaults:
  run:
    working-directory: worker

permissions:
  contents: read

jobs:
  # Required checks cannot be path-filtered (a check that never runs blocks the PR): the
  # workflow runs on every PR, this job tells whether the worker changed, and worker-ok below
  # is the single required check.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    defaults:
      run:
        working-directory: .
    outputs:
      worker: ${{ steps.files.outputs.worker }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$files" | grep -Eq '^(worker/|\.github/workflows/worker\.yml$)'; then
            echo "worker=true" >> "$GITHUB_OUTPUT"
          else
            echo "worker=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal -c rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: worker
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  deny:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: worker/Cargo.toml

  static-build:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal -t x86_64-unknown-linux-musl,aarch64-unknown-linux-musl && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: worker
      # cargo-zigbuild does not bring zig: add the ziglang wheel to its venv and put zig on PATH
      - name: cargo-zigbuild and zig
        run: |
          pipx install cargo-zigbuild
          pipx inject cargo-zigbuild ziglang
          py="$(pipx environment --value PIPX_LOCAL_VENVS)/cargo-zigbuild/bin/python"
          "$py" -I -c "import ziglang, os; print(os.path.dirname(ziglang.__file__))" >> "$GITHUB_PATH"
      - name: Build
        run: |
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo zigbuild --locked --release --target "$t"
          done
      - name: Static binaries only
        run: |
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            f=target/$t/release/shopguard-worker
            file "$f"
            file "$f" | grep -q 'statically linked' || { echo "::error::$t binary is not static"; exit 1; }
            ls -l "$f"
          done

  worker-ok:
    if: always()
    needs: [changes, check, deny, static-build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: All worker jobs passed or were not needed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a worker job ended with: $r"; exit 1 ;;
            esac
          done
