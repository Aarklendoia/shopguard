name: Worker

# Format, lint, tests, dependency policy and a static musl build on every PR and push.

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  pull_request:
    paths: ['worker/**', '.github/workflows/worker.yml']

defaults:
  run:
    working-directory: worker

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: worker/Cargo.toml

  static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker
      - run: pipx install cargo-zigbuild
      - name: Build
        run: |
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo zigbuild --locked --release --target "$t"
          done
      - name: Static binaries only
        run: |
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            f=target/$t/release/shopguard-worker
            file "$f"
            file "$f" | grep -q 'statically linked' || { echo "::error::$t binary is not static"; exit 1; }
            ls -l "$f"
          done
