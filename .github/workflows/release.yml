name: Release

# On main, release-please keeps one release PR per component up to date from the
# Conventional Commits that touch it. Merging the worker one tags worker-vX.Y.Z and
# creates the release; the image is then built and pushed to GHCR:
#   ghcr.io/<owner>/shopguard-worker:X.Y.Z, :X.Y, :latest
# Images are only rebuilt on a release: no scheduled rebuilds (the image holds nothing
# but our static binary, see audit.yml for dependency advisories).

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      worker: ${{ steps.rp.outputs['worker--release_created'] }}
      worker_version: ${{ steps.rp.outputs['worker--version'] }}
      plugin: ${{ steps.rp.outputs['plugin/dns/shopguard--release_created'] }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # a PR opened with GITHUB_TOKEN does not trigger the required checks
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  worker-image:
    needs: release-please
    if: needs.release-please.outputs.worker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write     # keyless cosign signature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal -t x86_64-unknown-linux-musl,aarch64-unknown-linux-musl && rustup default stable
      # cargo-zigbuild does not bring zig: add the ziglang wheel to its venv and put zig on PATH
      - name: cargo-zigbuild and zig
        run: |
          pipx install cargo-zigbuild
          pipx inject cargo-zigbuild ziglang
          py="$(pipx environment --value PIPX_LOCAL_VENVS)/cargo-zigbuild/bin/python"
          "$py" -I -c "import ziglang, os; print(os.path.dirname(ziglang.__file__))" >> "$GITHUB_PATH"

      - name: Static binaries
        working-directory: worker
        run: |
          cargo zigbuild --locked --release --target x86_64-unknown-linux-musl
          cargo zigbuild --locked --release --target aarch64-unknown-linux-musl
          mkdir -p dist/amd64 dist/arm64
          cp target/x86_64-unknown-linux-musl/release/shopguard-worker dist/amd64/
          cp target/aarch64-unknown-linux-musl/release/shopguard-worker dist/arm64/

      - id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shopguard-worker" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.worker_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.worker_version }}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # COPY only, no RUN: both platforms build without emulation
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: worker
          file: worker/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.img.outputs.name }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
