name: Audit

# Weekly RustSec check of the worker dependencies. A failure means a released image may
# need a fix release: update the dependency (Dependabot usually opens the PR) and merge
# a "fix(worker): …" PR so release-please publishes a new image.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: worker/Cargo.toml
          command: check advisories
