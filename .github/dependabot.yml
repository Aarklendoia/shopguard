version: 2
updates:
  - package-ecosystem: cargo
    directory: /worker
    schedule:
      interval: weekly
    # let a freshly published version age before proposing it (compromised releases are
    # usually yanked within days); security updates are not delayed
    cooldown:
      default-days: 7
    commit-message:
      prefix: fix(worker)
    groups:
      rust:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /worker
    schedule:
      interval: monthly
    commit-message:
      prefix: build(worker)

  # actions are pinned by commit SHA; Dependabot updates the SHA and the version comment
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
